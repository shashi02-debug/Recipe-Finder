<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #f0f8ff, #e6e6fa);
            color: #333;
        }

        header {
            text-align: center;
            padding: 2rem 0;
            background: #6a5acd;
            color: #fff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 3rem;
            margin: 0;
        }

        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2rem;
        }

        section {
            background: #fff;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            perspective: 1000px;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        section:hover {
            transform: rotateY(10deg) rotateX(5deg);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
        }

        section h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #6a5acd;
        }

        section p {
            font-size: 1.1rem;
            line-height: 1.6;
        }

        footer {
            text-align: center;
            padding: 1rem;
            background: #6a5acd;
            color: #fff;
            margin-top: 2rem;
            box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <header>
        <h1>About Us</h1>
    </header>

    <main>
        <section>
            <h2>Who We Are</h2>
            <p>We are passionate about providing useful content to help you with your needs!</p>
        </section>
        <section>
            <h2>Our Mission</h2>
            <p>Our mission is to make your life easier by providing high-quality articles and resources.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 All Rights Reserved</p>
    </footer>
</body>
</html>
