<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Finder</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Global Styling */
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            color: #fff;
            overflow-x: hidden;
            background: url('food1.jpg') no-repeat center center/cover;
        }

        /* Navbar Styling */
        .navbar {
            background: rgba(0, 0, 0, 0.8);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 10px 0;
        }

        .navbar nav ul {
            list-style: none;
            display: flex;
            justify-content: center;
            padding: 0;
            margin: 0;
        }

        .navbar nav ul li {
            margin: 0 15px;
        }

        .navbar nav ul li a {
            text-decoration: none;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            padding: 8px 15px;
            transition: all 0.3s ease;
            position: relative;
        }

        .navbar nav ul li a:hover {
            color: #ffcc00;
        }

        .navbar nav ul li a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 3px;
            background: #ffcc00;
            left: 50%;
            bottom: -3px;
            transition: width 0.3s, left 0.3s;
        }

        .navbar nav ul li a:hover::after {
            width: 100%;
            left: 0;
        }

        /* Hero Section */
        .container {
            text-align: center;
            padding: 100px 20px;
            background: rgba(0, 0, 0, 0.6);
            margin: 50px auto;
            border-radius: 20px;
            width: 80%;
        }

        .title {
            font-size: 4rem;
            background: linear-gradient(90deg, #ffcc00, #ff6f61);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        p {
            font-size: 1.5rem;
            margin: 20px 0;
        }

        input[type="text"] {
            width: 70%;
            max-width: 500px;
            padding: 15px;
            margin: 20px 0;
            border: none;
            border-radius: 50px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
            font-size: 1rem;
        }

        button {
            background: #ffcc00;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            background: #ffa500;
            transform: scale(1.05) translateY(-3px);
        }

        #recipeResults {
            margin-top: 50px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 15px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            font-size: 1rem;
            box-shadow: 0 -4px 10px rgba(0, 0, 0, 0.2);
        }

        footer p strong {
            color: #ffcc00;
        }
    </style>
</head>
<body>
    <header class="navbar">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="recipes.html">Recipes</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="settings.html">Settings</a></li>
                <li><a href="blog.html">Blog</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h1 class="title">🍽️ Recipe Finder 🍲</h1>
        <p>Enter ingredients you have, and we'll find the best recipes for you!</p>
        <input type="text" id="ingredientInput" placeholder="Enter ingredients (comma-separated)">
        <button onclick="findRecipes()">Find Recipes</button>
        <div id="recipeResults"></div>
    </div>

    <footer>
        <p>Developed by <strong>Manas Ram, Bhanu Teja, Shashikiran</strong></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
